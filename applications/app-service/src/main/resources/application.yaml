server:
  port: 8080
spring:
  application:
    name: "TicketSalesProcessor"
  devtools:
    add-properties: false
  profiles:
    default: "local"
app:
  # api: HTTP only; worker: queue consumer and scheduled jobs only; all: both (local development and tests)
  role: "${APP_ROLE:all}"
  api:
    # Secret: comes only from the environment. Blank disables the admin endpoints.
    admin-api-key: "${ADMIN_API_KEY:}"
    availability-poll-interval: "2s"
    availability-max-duration: "10m"
  sweeper:
    interval: "${SWEEPER_INTERVAL:30s}"
aws:
  region: "${AWS_REGION:us-east-1}"
  dynamodb:
    endpoint: "${DYNAMODB_ENDPOINT:http://localhost:8000}"
    tables:
      events: "${DYNAMODB_TABLE_PREFIX:ticketing}-events"
      orders: "${DYNAMODB_TABLE_PREFIX:ticketing}-orders"
      tickets: "${DYNAMODB_TABLE_PREFIX:ticketing}-tickets"
      audit: "${DYNAMODB_TABLE_PREFIX:ticketing}-audit"
      idempotency: "${DYNAMODB_TABLE_PREFIX:ticketing}-idempotency"
adapter:
  sqs:
    region: "${AWS_REGION:us-east-1}"
    queueUrl: "${ORDER_QUEUE_URL:http://localhost:9324/000000000000/order-placed}"
    confirmationQueueUrl: "${CONFIRMATION_QUEUE_URL:http://localhost:9324/000000000000/order-confirmation}"
    endpoint: "${SQS_ENDPOINT:http://localhost:9324}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
entrypoint:
  sqs:
    region: "${AWS_REGION:us-east-1}"
    endpoint: "${SQS_ENDPOINT:http://localhost:9324}"
    queueUrl: "${ORDER_QUEUE_URL:http://localhost:9324/000000000000/order-placed}"
    confirmationQueueUrl: "${CONFIRMATION_QUEUE_URL:http://localhost:9324/000000000000/order-confirmation}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 30
    numberOfThreads: 1
