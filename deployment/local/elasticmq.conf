include classpath("application.conf")

# "*" makes ElasticMQ build queue URLs from the request Host header,
# so the same queues work from the host (localhost) and from other containers.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  order-placed-dlq {}

  order-placed {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "order-placed-dlq"
      maxReceiveCount = 5
    }
  }

  order-confirmation-dlq {}

  order-confirmation {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "order-confirmation-dlq"
      maxReceiveCount = 5
    }
  }
}
